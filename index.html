<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경사하강법 최적화 시뮬레이션</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #1a202c;
        }
        p.desc {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 15px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: #ffffff;
            cursor: crosshair;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #4285f4;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #3367d6;
        }
        button:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .dashboard {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
            justify-content: space-around;
        }
        .card {
            padding: 15px;
            border-radius: 8px;
            width: 30%;
            text-align: center;
            border: 2px solid transparent;
        }
        .card h3 { margin: 0 0 10px 0; font-size: 16px; }
        .card .count { font-size: 24px; font-weight: bold; }
        
        .card.batch { border-color: #4285f4; color: #1a73e8; background: #e8f0fe; }
        .card.mini { border-color: #34a853; color: #188038; background: #e6f4ea; }
        .card.sgd { border-color: #ea4335; color: #c5221f; background: #fce8e6; }
    </style>
</head>
<body>

    <h1>경사하강법(Gradient Descent) 업데이트 시뮬레이션</h1>
    <p class="desc">가운데 최저점(오차 0)을 향해 각 알고리즘이 어떻게 이동(업데이트)하는지 관찰해 보세요.</p>

    <div class="container">
        <canvas id="lossCanvas" width="800" height="500"></canvas>
        
        <div class="dashboard">
            <div class="card batch">
                <h3>배치 (Batch)</h3>
                <div class="count" id="countBatch">0</div>
                <div style="font-size:12px; margin-top:5px;">1번 크게 이동<br>(정확하지만 느림)</div>
            </div>
            <div class="card mini">
                <h3>미니 배치 (Mini-Batch)</h3>
                <div class="count" id="countMini">0</div>
                <div style="font-size:12px; margin-top:5px;">적당히 나누어 이동<br>(안정적이고 효율적)</div>
            </div>
            <div class="card sgd">
                <h3>확률적 (SGD)</h3>
                <div class="count" id="countSgd">0</div>
                <div style="font-size:12px; margin-top:5px;">수시로 작게 이동<br>(빠르지만 지그재그)</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">시뮬레이션 시작</button>
            <button id="resetBtn">초기화 (새로고침)</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('lossCanvas');
        const ctx = canvas.getContext('2d');
        
        // 지형(손실 함수)의 중심 (목표 지점)
        const centerX = 400;
        const centerY = 250;
        const startX = 700;
        const startY = 50;

        let animationId;
        let isRunning = false;

        // 등고선(손실 함수의 시각화) 그리기
        function drawContours() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 1;
            for (let r = 50; r <= 800; r += 50) {
                ctx.beginPath();
                // 타원형 등고선 (y축 경사가 더 가파름을 표현)
                ctx.ellipse(centerX, centerY, r, r * 0.6, 0, 0, Math.PI * 2);
                ctx.strokeStyle = '#e2e8f0';
                ctx.stroke();
            }
            // 최저점 표시
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#fbbc04';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.fillStyle = '#000';
            ctx.font = '14px sans-serif';
            ctx.fillText('최저점 (오차 0)', centerX - 45, centerY + 25);
        }

        class Agent {
            constructor(name, color, lr, noiseLevel, updateIntervalMs) {
                this.name = name;
                this.color = color;
                this.x = startX;
                this.y = startY;
                this.history = [{x: this.x, y: this.y}];
                this.lr = lr;                     // 학습률 (보폭)
                this.noiseLevel = noiseLevel;     // 방향의 불안정성 (SGD의 특징)
                this.updateIntervalMs = updateIntervalMs; // 업데이트 주기
                this.lastUpdate = Date.now();
                this.updateCount = 0;
                this.reached = false;
            }

            update() {
                if (this.reached) return;

                const now = Date.now();
                if (now - this.lastUpdate >= this.updateIntervalMs) {
                    // 1. 현재 위치에서 기울기(Gradient) 계산
                    let gradX = (this.x - centerX);
                    let gradY = (this.y - centerY) * 1.5; // y축이 더 가파름

                    // 2. 노이즈 추가 (데이터 일부만 보았을 때의 오차율 시뮬레이션)
                    gradX += (Math.random() - 0.5) * this.noiseLevel;
                    gradY += (Math.random() - 0.5) * this.noiseLevel;

                    // 3. 파라미터 업데이트 (이동)
                    this.x -= gradX * this.lr;
                    this.y -= gradY * this.lr;
                    
                    this.history.push({x: this.x, y: this.y});
                    this.updateCount++;
                    this.lastUpdate = now;

                    // 4. 도착 판정 (중심 근처 도달 시)
                    const dist = Math.sqrt(Math.pow(this.x - centerX, 2) + Math.pow(this.y - centerY, 2));
                    if (dist < 10) this.reached = true;
                }
            }

            draw() {
                // 궤적 그리기
                ctx.beginPath();
                ctx.moveTo(this.history[0].x, this.history[0].y);
                for (let i = 1; i < this.history.length; i++) {
                    ctx.lineTo(this.history[i].x, this.history[i].y);
                }
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.lineJoin = 'round';
                ctx.stroke();

                // 현재 위치 점 찍기
                ctx.beginPath();
                ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.stroke();
            }
        }

        // 3가지 알고리즘 에이전트 생성
        // Agent(이름, 색상, 학습률(보폭), 노이즈(불안정성), 업데이트주기(ms))
        let agents = [];

        function initAgents() {
            agents = [
                // 배치: 노이즈 없음, 큰 보폭, 매우 느린 업데이트 (1초에 1번)
                new Agent('Batch', '#4285f4', 0.25, 0, 1000),
                // 미니배치: 약간의 노이즈, 중간 보폭, 중간 속도 (0.1초에 1번)
                new Agent('Mini', '#34a853', 0.08, 150, 100),
                // SGD: 큰 노이즈(지그재그), 작은 보폭, 매우 빠른 업데이트 (0.02초에 1번)
                new Agent('SGD', '#ea4335', 0.03, 500, 20)
            ];
            updateUI();
        }

        function updateUI() {
            document.getElementById('countBatch').innerText = agents[0].updateCount;
            document.getElementById('countMini').innerText = agents[1].updateCount;
            document.getElementById('countSgd').innerText = agents[2].updateCount;
        }

        function animate() {
            if (!isRunning) return;
            
            drawContours();
            
            agents.forEach(agent => {
                agent.update();
                agent.draw();
            });
            
            updateUI();
            animationId = requestAnimationFrame(animate);
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!isRunning) {
                isRunning = true;
                document.getElementById('startBtn').disabled = true;
                // 모든 에이전트의 시작 시간을 버튼 누른 시점으로 동기화
                const now = Date.now();
                agents.forEach(a => a.lastUpdate = now);
                animate();
            }
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            isRunning = false;
            cancelAnimationFrame(animationId);
            document.getElementById('startBtn').disabled = false;
            initAgents();
            drawContours();
        });

        // 초기 화면 그리기
        initAgents();
        drawContours();
        
    </script>
</body>
</html>
